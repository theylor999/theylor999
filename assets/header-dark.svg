.a{fill:#2dd4bf}
.h{fill:none;stroke:#e6edf3;stroke-width:1.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.4s cubic-bezier(.22,1,.36,1) both}
.f{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.2s 2s ease-out both}
.b{fill:#2dd4bf;animation:fade 1s 2.2s ease-out both}
