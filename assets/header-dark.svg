<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-labelledby="t d">
<title id="t">Theylor Machado, data scientist, demand forecasting</title>
<desc id="d">A weekly demand series with a backtest window, where a model forecast is compared with data it never saw, followed by a forecast with 80% and 95% prediction intervals.</desc>
