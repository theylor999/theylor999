@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text x="48" y="52" class="n">Theylor Machado</text>
<text x="48" y="80" class="s">Data scientist. I forecast demand and build the software around the forecast.</text>
