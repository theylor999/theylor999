.t{fill:none;stroke:#2dd4bf;stroke-width:1.6;stroke-dasharray:4 4;animation:fade .8s 1.8s ease-out both}
.f{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.2s 2.4s ease-out both}
