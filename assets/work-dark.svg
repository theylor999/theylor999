.k{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:40px;font-weight:700;letter-spacing:-1px}
.sp{fill:none;stroke:#e6edf3;stroke-width:1.3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.22,1,.36,1) both}
.bar{transform-box:fill-box;transform-origin:left;animation:shrink 1.4s .6s cubic-bezier(.22,1,.36,1) both}
