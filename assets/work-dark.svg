<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t2 d2">
<title id="t2">Forecasting work at nPLAN</title>
<desc id="d2">Six demand profiles, each with the model that won its backtest: seasonal AutoARIMA, intermittent TSB, trend AutoNHITS, promotions AutoLGBM, short history Chronos, noisy ensemble. Accuracy up 10 percentage points over the forecast clients used. Model run time down from 8 hours to 2.</desc>
